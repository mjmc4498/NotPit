<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotPit - Gestor de Notas de Reuniones</title>
    <meta name="theme-color" content="#212529">
    <link rel="manifest" href="manifest.json">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex vh-100">
        <!-- Sidebar -->
        <aside class="sidebar bg-light border-end">
            <div class="sidebar-header p-3 border-bottom">
                <h1 class="h5 mb-0" data-i18n-key="sidebar_header"></h1>
            </div>
            <div class="p-3">
                <input type="search" class="form-control form-control-sm" data-i18n-placeholder-key="filter_meetings_placeholder">
            </div>
            <ul id="meetings-sidebar-list" class="list-group list-group-flush overflow-auto">
                <!-- Meeting items will be rendered here by view.js -->
            </ul>
            <div class="sidebar-footer p-3 border-top mt-auto">
                <button class="btn btn-primary w-100 mb-2" id="new-meeting-btn" data-i18n-key="new_meeting_btn"></button>
                <div class="btn-group w-100">
                    <button class="btn btn-outline-secondary w-50" id="import-btn" data-i18n-key="import_btn"></button>
                    <input type="file" id="import-file-input" class="d-none" accept=".json">
                    <button class="btn btn-outline-secondary w-50" id="export-workspace-btn" data-i18n-key="export_all_btn"></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content flex-grow-1 p-4 overflow-auto">
            <!-- This view is shown when a meeting is selected -->
            <div id="meeting-content-view" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 id="main-meeting-title" class="h3 mb-0"></h2>
                    <div class="btn-group">
                        <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" data-i18n-key="export_dropdown"></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" id="export-meeting-json-btn" href="#" data-i18n-key="export_meeting_json"></a></li>
                            <li><a class="dropdown-item" id="export-meeting-md-btn" href="#" data-i18n-key="export_meeting_md"></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" id="export-tasks-csv-btn" href="#" data-i18n-key="export_tasks_csv"></a></li>
                        </ul>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <ul class="nav nav-tabs" id="meetingTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="agenda-tab" data-bs-toggle="tab" data-bs-target="#agenda-pane" type="button" role="tab" aria-controls="agenda-pane" aria-selected="true" data-i18n-key="agenda_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="notas-tab" data-bs-toggle="tab" data-bs-target="#notas-pane" type="button" role="tab" aria-controls="notas-pane" aria-selected="false" data-i18n-key="notes_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="acuerdos-tab" data-bs-toggle="tab" data-bs-target="#acuerdos-pane" type="button" role="tab" aria-controls="acuerdos-pane" aria-selected="false" data-i18n-key="agreements_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="decisiones-tab" data-bs-toggle="tab" data-bs-target="#decisiones-pane" type="button" role="tab" aria-controls="decisiones-pane" aria-selected="false" data-i18n-key="decisions_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tareas-tab" data-bs-toggle="tab" data-bs-target="#tareas-pane" type="button" role="tab" aria-controls="tareas-pane" aria-selected="false" data-i18n-key="tasks_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="timeline-tab" data-bs-toggle="tab" data-bs-target="#timeline-pane" type="button" role="tab" aria-controls="timeline-pane" aria-selected="false" data-i18n-key="timeline_tab">Timeline</button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content p-3 border border-top-0" id="meetingTabContent">
                    <div class="tab-pane fade show active" id="agenda-pane" role="tabpanel" aria-labelledby="agenda-tab"></div>
                    <div class="tab-pane fade" id="notas-pane" role="tabpanel" aria-labelledby="notas-tab"></div>
                    <div class="tab-pane fade" id="acuerdos-pane" role="tabpanel" aria-labelledby="acuerdos-tab"></div>
                    <div class="tab-pane fade" id="decisiones-pane" role="tabpanel" aria-labelledby="decisiones-tab"></div>
                    <div class="tab-pane fade" id="tareas-pane" role="tabpanel" aria-labelledby="tareas-tab"></div>
                    <div class="tab-pane fade" id="timeline-pane" role="tabpanel" aria-labelledby="timeline-tab"></div>
                </div>
            </div>

            <!-- This view is shown when no meeting is selected -->
            <div id="empty-view" class="text-center mt-5">
                <h3 class="text-muted" data-i18n-key="empty_view_header"></h3>
                <p class="text-muted" data-i18n-key="empty_view_text"></p>
            </div>
        </main>
    </div>

    <!-- New Meeting Modal -->
    <div class="modal fade" id="new-meeting-modal" tabindex="-1" aria-labelledby="newMeetingModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newMeetingModalLabel" data-i18n-key="new_meeting_modal_title">Create New Meeting</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="new-meeting-form">
              <div class="mb-3">
                <label for="new-meeting-title" class="form-label" data-i18n-key="new_meeting_title_label">Meeting Title</label>
                <input type="text" class="form-control" id="new-meeting-title" required>
              </div>
              <div class="mb-3">
                <label for="new-meeting-template" class="form-label" data-i18n-key="new_meeting_template_label">Agenda Template</label>
                <select class="form-select" id="new-meeting-template">
                  <option value="none" data-i18n-key="template_none">None (Blank Agenda)</option>
                  <!-- Templates will be populated here -->
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n-key="cancel_btn">Cancel</button>
            <button type="submit" form="new-meeting-form" class="btn btn-primary" data-i18n-key="create_meeting_btn">Create Meeting</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
