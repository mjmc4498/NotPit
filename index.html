<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotPit - Gestor de Notas de Reuniones</title>
    <meta name="theme-color" content="#212529">
    <link rel="manifest" href="manifest.json">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-flex justify-content-center align-items-center" style="z-index: 2200;">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p id="loading-message" class="ms-3 text-white"></p>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2100">
        <!-- Toasts will be appended here -->
    </div>

    <div id="locked-view" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark d-flex justify-content-center align-items-center" style="z-index: 2000;">
        <div class="text-center text-white">
            <h1 data-i18n-key="workspace_locked_title">Workspace Locked</h1>
            <p data-i18n-key="workspace_locked_text">Enter your password to unlock.</p>
            <form id="unlock-form" class="d-flex justify-content-center">
                <input type="password" id="unlock-password" class="form-control w-auto" required>
                <button type="submit" class="btn btn-primary ms-2" data-i18n-key="unlock_btn">Unlock</button>
            </form>
        </div>
    </div>

    <div class="d-flex vh-100">
        <!-- Sidebar -->
        <aside class="sidebar bg-light border-end">
            <div class="sidebar-header p-3 border-bottom">
                <h1 class="h5 mb-0" data-i18n-key="sidebar_header"></h1>
            </div>
            <div class="p-3">
                <input type="search" class="form-control form-control-sm" data-i18n-placeholder-key="filter_meetings_placeholder">
            </div>
            <ul id="meetings-sidebar-list" class="list-group list-group-flush overflow-auto">
                <!-- Meeting items will be rendered here by view.js -->
            </ul>
            <div class="sidebar-footer p-3 border-top mt-auto">
                <button class="btn btn-primary w-100 mb-2" id="new-meeting-btn"><i class="bi bi-plus-lg"></i> <span data-i18n-key="new_meeting_btn"></span></button>
                <div class="btn-group w-100">
                    <button class="btn btn-outline-secondary w-50" id="import-btn"><i class="bi bi-box-arrow-in-down"></i> <span data-i18n-key="import_btn"></span></button>
                    <input type="file" id="import-file-input" class="d-none" accept=".json">
                    <button class="btn btn-outline-secondary w-50" id="export-workspace-btn"><i class="bi bi-box-arrow-up"></i> <span data-i18n-key="export_all_btn"></span></button>
                </div>
                <div class="btn-group w-100 mt-2">
                    <button class="btn btn-outline-danger w-50" id="lock-workspace-btn"><i class="bi bi-lock"></i> <span data-i18n-key="lock_workspace_btn"></span></button>
                    <button class="btn btn-outline-secondary w-50" id="settings-btn" data-bs-toggle="modal" data-bs-target="#settings-modal"><i class="bi bi-gear"></i> <span data-i18n-key="settings_btn"></span></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content flex-grow-1 p-4 overflow-auto">
            <!-- This view is shown when a meeting is selected -->
            <div id="meeting-content-view" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center">
                        <h2 id="main-meeting-title" class="h3 mb-0"></h2>
                        <button id="rename-meeting-btn" class="btn btn-sm btn-outline-secondary ms-2"><i class="bi bi-pencil"></i></button>
                    </div>
                    <div class="btn-group">
                        <button id="sign-meeting-btn" class="btn btn-warning btn-sm d-none"><i class="bi bi-pen"></i> <span data-i18n-key="sign_close_btn"></span></button>
                        <button id="share-btn" type="button" class="btn btn-outline-secondary d-none"><i class="bi bi-share"></i> <span data-i18n-key="share_btn"></span></button>
                        <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-download"></i> <span data-i18n-key="export_dropdown"></span></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" id="export-meeting-json-btn" href="#" data-i18n-key="export_meeting_json"></a></li>
                            <li><a class="dropdown-item" id="export-meeting-md-btn" href="#" data-i18n-key="export_meeting_md"></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" id="export-tasks-csv-btn" href="#" data-i18n-key="export_tasks_csv"></a></li>
                            <li><a class="dropdown-item" id="copy-tasks-csv-btn" href="#" data-i18n-key="copy_tasks_csv">Copy Tasks (CSV)</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <ul class="nav nav-tabs" id="meetingTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="agenda-tab" data-bs-toggle="tab" data-bs-target="#agenda-pane" type="button" role="tab" aria-controls="agenda-pane" aria-selected="true" data-i18n-key="agenda_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="notes-tab" data-bs-toggle="tab" data-bs-target="#notas-pane" type="button" role="tab" aria-controls="notas-pane" aria-selected="false" data-i18n-key="notes_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tasks-tab" data-bs-toggle="tab" data-bs-target="#tareas-pane" type="button" role="tab" aria-controls="tareas-pane" aria-selected="false" data-i18n-key="tasks_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="agreements-tab" data-bs-toggle="tab" data-bs-target="#agreements-pane" type="button" role="tab" aria-controls="agreements-pane" aria-selected="false" data-i18n-key="agreements_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="decisions-tab" data-bs-toggle="tab" data-bs-target="#decisions-pane" type="button" role="tab" aria-controls="decisions-pane" aria-selected="false" data-i18n-key="decisions_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="timeline-tab" data-bs-toggle="tab" data-bs-target="#timeline-pane" type="button" role="tab" aria-controls="timeline-pane" aria-selected="false" data-i18n-key="timeline_tab"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit-pane" type="button" role="tab" aria-controls="audit-pane" aria-selected="false" data-i18n-key="audit_tab"></button>
                    </li>
                     <li class="nav-item" role="presentation">
                        <button class="nav-link" id="gantt-tab" data-bs-toggle="tab" data-bs-target="#gantt-pane" type="button" role="tab" aria-controls="gantt-pane" aria-selected="false" data-i18n-key="gantt_tab"></button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content p-3 border border-top-0" id="meetingTabContent">
                    <div class="tab-pane fade show active" id="agenda-pane" role="tabpanel" aria-labelledby="agenda-tab"></div>
                    <div class="tab-pane fade" id="notas-pane" role="tabpanel" aria-labelledby="notas-tab"></div>
                            <div class="tab-pane fade" id="tareas-pane" role="tabpanel" aria-labelledby="tasks-tab"></div>
                            <div class="tab-pane fade" id="agreements-pane" role="tabpanel" aria-labelledby="agreements-tab"></div>
                            <div class="tab-pane fade" id="decisions-pane" role="tabpanel" aria-labelledby="decisions-tab"></div>
                    <div class="tab-pane fade" id="timeline-pane" role="tabpanel" aria-labelledby="timeline-tab"></div>
                    <div class="tab-pane fade" id="audit-pane" role="tabpanel" aria-labelledby="audit-tab"></div>
                    <div class="tab-pane fade" id="gantt-pane" role="tabpanel" aria-labelledby="gantt-tab">
                        <svg id="gantt-chart"></svg>
                    </div>
                </div>
            </div>

            <!-- This view is shown when no meeting is selected -->
            <div id="empty-view" class="text-center mt-5">
                <h3 class="text-muted" data-i18n-key="empty_view_header"></h3>
                <p class="text-muted" data-i18n-key="empty_view_text"></p>
            </div>
        </main>
    </div>

    <!-- New Meeting Modal -->
    <div class="modal fade" id="new-meeting-modal" tabindex="-1" aria-labelledby="newMeetingModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newMeetingModalLabel" data-i18n-key="new_meeting_modal_title">Create New Meeting</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="new-meeting-form">
              <div class="mb-3">
                <label for="new-meeting-title" class="form-label" data-i18n-key="new_meeting_title_label">Meeting Title</label>
                <input type="text" class="form-control" id="new-meeting-title" required>
              </div>
              <div class="mb-3">
                <label for="new-meeting-template" class="form-label" data-i18n-key="new_meeting_template_label">Agenda Template</label>
                <select class="form-select" id="new-meeting-template">
                  <option value="none" data-i18n-key="template_none">None (Blank Agenda)</option>
                  <!-- Templates will be populated here -->
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n-key="cancel_btn">Cancel</button>
            <button type="submit" form="new-meeting-form" class="btn btn-primary" data-i18n-key="create_meeting_btn">Create Meeting</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settings-modal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="settingsModalLabel" data-i18n-key="settings_modal_title">Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6 data-i18n-key="security_section_title">Security</h6>
                    <div id="security-settings-view">
                        <!-- Content will be rendered by the view based on encryption state -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Privacy Banner -->
    <div id="privacy-banner" class="alert alert-info alert-dismissible fade show m-3" role="alert">
        <strong data-i18n-key="privacy_banner_title">Your Privacy Matters.</strong>
        <span data-i18n-key="privacy_banner_text">All your data is stored locally on your device and is never sent to any server.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmation-modal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel" data-i18n-key="confirm_modal_title">Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmation-modal-body">
                    Are you sure?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n-key="cancel_btn">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmation-modal-confirm-btn" data-i18n-key="confirm_btn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
