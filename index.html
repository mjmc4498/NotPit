<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotPit - Meeting Notes Manager</title>
    <meta name="theme-color" content="#212529">
    <link rel="manifest" href="manifest.json">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex vh-100">
        <!-- Sidebar -->
        <aside class="sidebar bg-light border-end">
            <div class="sidebar-header p-3 border-bottom">
                <h1 class="h5 mb-0">NotPit Meetings</h1>
            </div>
            <div class="p-3">
                <input type="search" class="form-control form-control-sm" placeholder="Filter meetings...">
            </div>
            <ul id="meetings-sidebar-list" class="list-group list-group-flush overflow-auto">
                <!-- Meeting items will be rendered here by view.js -->
            </ul>
            <div class="sidebar-footer p-3 border-top mt-auto">
                <button class="btn btn-primary w-100" id="new-meeting-btn">New Meeting</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content flex-grow-1 p-4 overflow-auto">
            <!-- This view is shown when a meeting is selected -->
            <div id="meeting-content-view" class="d-none">
                <h2 id="main-meeting-title" class="h3 mb-3">Meeting Title Will Go Here</h2>

                <!-- Tab Navigation -->
                <ul class="nav nav-tabs" id="meetingTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="agenda-tab" data-bs-toggle="tab" data-bs-target="#agenda-pane" type="button" role="tab" aria-controls="agenda-pane" aria-selected="true">Agenda</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="notas-tab" data-bs-toggle="tab" data-bs-target="#notas-pane" type="button" role="tab" aria-controls="notas-pane" aria-selected="false">Notas</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="acuerdos-tab" data-bs-toggle="tab" data-bs-target="#acuerdos-pane" type="button" role="tab" aria-controls="acuerdos-pane" aria-selected="false">Acuerdos</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="decisiones-tab" data-bs-toggle="tab" data-bs-target="#decisiones-pane" type="button" role="tab" aria-controls="decisiones-pane" aria-selected="false">Decisiones</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="tareas-tab" data-bs-toggle="tab" data-bs-target="#tareas-pane" type="button" role="tab" aria-controls="tareas-pane" aria-selected="false">Tareas</button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content p-3 border border-top-0" id="meetingTabContent">
                    <div class="tab-pane fade show active" id="agenda-pane" role="tabpanel" aria-labelledby="agenda-tab">
                        <p>Agenda content will go here.</p>
                    </div>
                    <div class="tab-pane fade" id="notas-pane" role="tabpanel" aria-labelledby="notas-tab">
                        <p>Notes content will go here.</p>
                    </div>
                    <div class="tab-pane fade" id="acuerdos-pane" role="tabpanel" aria-labelledby="acuerdos-tab">
                        <p>Agreements content will go here.</p>
                    </div>
                    <div class="tab-pane fade" id="decisiones-pane" role="tabpanel" aria-labelledby="decisiones-tab">
                        <p>Decisions content will go here.</p>
                    </div>
                    <div class="tab-pane fade" id="tareas-pane" role="tabpanel" aria-labelledby="tareas-tab">
                        <p>Tasks content will go here.</p>
                    </div>
                </div>
            </div>

            <!-- This view is shown when no meeting is selected -->
            <div id="empty-view" class="text-center mt-5">
                <h3 class="text-muted">No Meeting Selected</h3>
                <p class="text-muted">Select a meeting from the sidebar or create a new one to get started.</p>
            </div>
        </main>
    </div>

    <!-- Modals will be re-added here as needed by the new UI -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
